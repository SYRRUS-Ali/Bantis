name: Range CI/CD Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'range/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'range/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:
    inputs:
      rollback_sha:
        description: "Commit SHA of a previously published image to roll back to. Leave empty for a no-op run."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build image (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./range/api
          push: false
          tags: bantis-range-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test:
    name: Test & Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'workflow_dispatch'
    timeout-minutes: 15
    defaults:
      run:
        working-directory: range
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Lint with Ruff
        run: |
          pip install ruff
          ruff check api

      - name: Create CI .env file
        run: |
          cat > .env << EOF
          POSTGRES_USER=ci_user
          POSTGRES_PASSWORD=ci_pass_${{ github.run_id }}
          POSTGRES_DB=ci_db
          DATABASE_URL=postgresql+asyncpg://ci_user:ci_pass_${{ github.run_id }}@db:5432/ci_db
          JWT_SECRET_KEY=ci-secret-${{ github.run_id }}-not-for-production
          ACCESS_TOKEN_EXPIRE_MINUTES=30
          LOG_LEVEL=INFO
          NGINX_PORT=8080
          REDIS_PASSWORD=ci_redis_${{ github.run_id }}
          REDIS_URL=redis://:ci_redis_${{ github.run_id }}@redis:6379/0
          CACHE_TTL_SECONDS=60
          COMPOSE_PROFILES=range
          EOF

      - name: Start the range stack
        run: docker compose up --build -d

      - name: Wait for the stack to be healthy
        run: |
          for i in $(seq 1 30); do
            if curl --silent --fail http://localhost:8080/health > /dev/null; then
              echo "Range is ready"
              exit 0
            fi
            echo "Waiting for range... ($i/30)"
            sleep 2
          done
          echo "Range did not become ready in time"
          docker compose logs
          exit 1

      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      - name: Run tests
        env:
          API_BASE_URL: http://localhost:8080
        run: pytest tests -v

      - name: Show container logs
        if: always()
        run: docker compose logs

      - name: Tear down the range stack
        if: always()
        run: docker compose down -v

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'workflow_dispatch'
    timeout-minutes: 15
    container:
      image: semgrep/semgrep
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show Semgrep findings (human-readable)
        run: >
          semgrep scan
          --config p/default
          --config p/python
          --config p/dockerfile
          range

      - name: Run Semgrep scan
        run: >
          semgrep scan
          --config p/default
          --config p/python
          --config p/dockerfile
          range
          --sarif
          --output semgrep.sarif
          --error

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@9e3211c9a3b9311dfe05da2ed48eea3386f042dd # v4.37.6
        with:
          sarif_file: semgrep.sarif
        if: always() && !github.event.repository.private

  secrets-scan:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'workflow_dispatch'
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download and verify Gitleaks
        run: |
          curl -sSL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Run Gitleaks scan
        run: ./gitleaks git . --verbose

  dependency-scan:
    name: Dependency Scan (pip-audit)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'workflow_dispatch'
    timeout-minutes: 10
    defaults:
      run:
        working-directory: range
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit runtime dependencies
        run: pip-audit -r api/requirements.txt

      - name: Audit test dependencies
        run: pip-audit -r tests/requirements.txt

  push:
    name: Push to GHCR
    runs-on: ubuntu-latest
    needs: [test, sast, secrets-scan, dependency-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    outputs:
      image_name: ${{ steps.image-name.outputs.name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Set lowercase image name
        id: image-name
        run: |
          NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=$NAME" >> "$GITHUB_ENV"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image (SHA tag only)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./range/api
          push: true
          tags: ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy (Staging Simulation)
    runs-on: ubuntu-latest
    needs: push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: range
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull published image and tag it for compose
        run: |
          docker pull "ghcr.io/${{ needs.push.outputs.image_name }}:${{ github.sha }}"
          docker tag "ghcr.io/${{ needs.push.outputs.image_name }}:${{ github.sha }}" compose-multiservice-app-api:latest

      - name: Create staging .env file
        run: |
          cat > .env << EOF
          POSTGRES_USER=staging_user
          POSTGRES_PASSWORD=staging_pass_${{ github.run_id }}
          POSTGRES_DB=staging_db
          DATABASE_URL=postgresql+asyncpg://staging_user:staging_pass_${{ github.run_id }}@db:5432/staging_db
          JWT_SECRET_KEY=staging-secret-${{ github.run_id }}-not-for-production
          ACCESS_TOKEN_EXPIRE_MINUTES=30
          LOG_LEVEL=INFO
          NGINX_PORT=8080
          REDIS_PASSWORD=staging_redis_${{ github.run_id }}
          REDIS_URL=redis://:staging_redis_${{ github.run_id }}@redis:6379/0
          CACHE_TTL_SECONDS=60
          COMPOSE_PROFILES=range
          EOF

      - name: Start the range stack using the published image
        run: docker compose up -d

      - name: Wait for the stack to be healthy
        run: |
          for i in $(seq 1 15); do
            if curl --silent --fail http://localhost:8080/health > /dev/null; then
              echo "Staging is ready"
              exit 0
            fi
            echo "Waiting for staging... ($i/15)"
            sleep 2
          done
          echo "Staging did not become ready in time"
          docker compose logs
          exit 1

      - name: Smoke test - health endpoint
        run: |
          curl --silent --fail http://localhost:8080/health | grep -q '"status":"ok"'

      - name: Smoke test - version endpoint
        run: |
          curl --silent --fail http://localhost:8080/version | grep -q '"version"'

      - name: Show container logs
        if: always()
        run: docker compose logs

      - name: Tear down staging stack
        if: always()
        run: docker compose down -v

  promote-latest:
    name: Promote to Latest
    runs-on: ubuntu-latest
    needs: [push, deploy-staging]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag validated image as latest
        env:
          IMAGE_NAME: ${{ needs.push.outputs.image_name }}
          SHA: ${{ github.sha }}
        run: |
          docker pull "ghcr.io/${IMAGE_NAME}:${SHA}"
          docker tag "ghcr.io/${IMAGE_NAME}:${SHA}" "ghcr.io/${IMAGE_NAME}:latest"
          docker push "ghcr.io/${IMAGE_NAME}:latest"

  rollback:
    name: Rollback to Previous Image
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.rollback_sha != ''
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set lowercase image name
        id: image-name
        run: |
          NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Roll back latest tag
        env:
          IMAGE_NAME: ${{ steps.image-name.outputs.name }}
          ROLLBACK_SHA: ${{ inputs.rollback_sha }}
        run: |
          docker pull "ghcr.io/${IMAGE_NAME}:${ROLLBACK_SHA}"
          docker tag "ghcr.io/${IMAGE_NAME}:${ROLLBACK_SHA}" "ghcr.io/${IMAGE_NAME}:latest"
          docker push "ghcr.io/${IMAGE_NAME}:latest"

      - name: Notify Telegram of rollback
        env:
          ROLLBACK_SHA: ${{ inputs.rollback_sha }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MESSAGE="🔄 *Bantis range* — rolled back
          latest now points to: \`${ROLLBACK_SHA}\`
          Triggered by: ${ACTOR}
          Run: ${RUN_URL}"

          curl -sS -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d parse_mode="Markdown" \
            --data-urlencode "text=$MESSAGE"

  notify:
    name: Notify Telegram
    runs-on: ubuntu-latest
    needs: [build, test, sast, secrets-scan, dependency-scan, push, deploy-staging, promote-latest]
    if: always() && github.event_name != 'workflow_dispatch'
    timeout-minutes: 5
    steps:
      - name: Determine pipeline status
        id: status
        run: |
          RESULTS="${{ needs.build.result }} ${{ needs.test.result }} ${{ needs.sast.result }} ${{ needs.secrets-scan.result }} ${{ needs.dependency-scan.result }} ${{ needs.push.result }} ${{ needs.deploy-staging.result }} ${{ needs.promote-latest.result }}"
          if echo "$RESULTS" | grep -q "failure"; then
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "emoji=❌" >> "$GITHUB_OUTPUT"
          else
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "emoji=✅" >> "$GITHUB_OUTPUT"
          fi

      - name: Send Telegram notification
        env:
          STATUS_EMOJI: ${{ steps.status.outputs.emoji }}
          STATUS_TEXT: ${{ steps.status.outputs.status }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MESSAGE="${STATUS_EMOJI} *Bantis range* — ${STATUS_TEXT}
          Branch: \`${REF_NAME}\`
          Commit: \`${COMMIT_SHA}\`
          By: ${ACTOR}
          Run: ${RUN_URL}"

          curl -sS -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d parse_mode="Markdown" \
            --data-urlencode "text=$MESSAGE"