name: Range CI/CD Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'range/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'range/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:
    inputs:
      rollback_sha:
        description: "Commit SHA of a previously published image to roll back to. Leave empty for a no-op run."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build image (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./range/api
          push: false
          tags: bantis-range-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test:
    name: Test & Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'workflow_dispatch'
    timeout-minutes: 10
    defaults:
      run:
        working-directory: range
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -r api/requirements.txt
          pip install -r tests/requirements.txt

      - name: Lint with Ruff
        run: |
          pip install ruff
          ruff check api

      - name: Run tests
        run: pytest tests -v

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'workflow_dispatch'
    timeout-minutes: 15
    container:
      image: semgrep/semgrep
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show Semgrep findings (human-readable)
        run: >
          semgrep scan
          --config p/default
          --config p/python
          --config p/dockerfile
          range

      - name: Run Semgrep scan
        run: >
          semgrep scan
          --config p/default
          --config p/python
          --config p/dockerfile
          range
          --sarif
          --output semgrep.sarif
          --error

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@9e3211c9a3b9311dfe05da2ed48eea3386f042dd # v4.37.6
        with:
          sarif_file: semgrep.sarif
        if: always() && !github.event.repository.private

  secrets-scan:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'workflow_dispatch'
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download and verify Gitleaks
        run: |
          curl -sSL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Run Gitleaks scan
        run: ./gitleaks git . --verbose

  dependency-scan:
    name: Dependency Scan (pip-audit)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'workflow_dispatch'
    timeout-minutes: 10
    defaults:
      run:
        working-directory: range
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit runtime dependencies
        run: pip-audit -r api/requirements.txt

      - name: Audit test dependencies
        run: pip-audit -r tests/requirements.txt

  push:
    name: Push to GHCR
    runs-on: ubuntu-latest
    needs: [test, sast, secrets-scan, dependency-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    outputs:
      image_name: ${{ steps.image-name.outputs.name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Set lowercase image name
        id: image-name
        run: |
          NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=$NAME" >> "$GITHUB_ENV"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image (SHA tag only)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./range/api
          push: true
          tags: ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy (Staging Simulation)
    runs-on: ubuntu-latest
    needs: push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull published image
        run: docker pull "ghcr.io/${{ needs.push.outputs.image_name }}:${{ github.sha }}"

      - name: Run container (staging simulation)
        run: |
          docker run -d --name staging -p 8000:8000 \
            "ghcr.io/${{ needs.push.outputs.image_name }}:${{ github.sha }}"

      - name: Wait for app to be ready
        run: |
          for i in $(seq 1 10); do
            if curl --silent --fail http://localhost:8000/health > /dev/null; then
              echo "App is ready"
              exit 0
            fi
            echo "Waiting for app... ($i/10)"
            sleep 2
          done
          echo "App did not become ready in time"
          exit 1

      - name: Smoke test - health endpoint
        run: |
          curl --silent --fail http://localhost:8000/health | grep -q '"status":"ok"'

      - name: Smoke test - version endpoint
        run: |
          curl --silent --fail http://localhost:8000/version | grep -q '"version"'

      - name: Show container logs
        if: always()
        run: docker logs staging

      - name: Tear down staging container
        if: always()
        run: docker rm -f staging

  promote-latest:
    name: Promote to Latest
    runs-on: ubuntu-latest
    needs: [push, deploy-staging]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag validated image as latest
        env:
          IMAGE_NAME: ${{ needs.push.outputs.image_name }}
          SHA: ${{ github.sha }}
        run: |
          docker pull "ghcr.io/${IMAGE_NAME}:${SHA}"
          docker tag "ghcr.io/${IMAGE_NAME}:${SHA}" "ghcr.io/${IMAGE_NAME}:latest"
          docker push "ghcr.io/${IMAGE_NAME}:latest"

  rollback:
    name: Rollback to Previous Image
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.rollback_sha != ''
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set lowercase image name
        id: image-name
        run: |
          NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Roll back latest tag
        env:
          IMAGE_NAME: ${{ steps.image-name.outputs.name }}
          ROLLBACK_SHA: ${{ inputs.rollback_sha }}
        run: |
          docker pull "ghcr.io/${IMAGE_NAME}:${ROLLBACK_SHA}"
          docker tag "ghcr.io/${IMAGE_NAME}:${ROLLBACK_SHA}" "ghcr.io/${IMAGE_NAME}:latest"
          docker push "ghcr.io/${IMAGE_NAME}:latest"

      - name: Notify Telegram of rollback
        env:
          ROLLBACK_SHA: ${{ inputs.rollback_sha }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MESSAGE="🔄 *Bantis range* — rolled back
          latest now points to: \`${ROLLBACK_SHA}\`
          Triggered by: ${ACTOR}
          Run: ${RUN_URL}"

          curl -sS -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d parse_mode="Markdown" \
            --data-urlencode "text=$MESSAGE"

  notify:
    name: Notify Telegram
    runs-on: ubuntu-latest
    needs: [build, test, sast, secrets-scan, dependency-scan, push, deploy-staging, promote-latest]
    if: always() && github.event_name != 'workflow_dispatch'
    timeout-minutes: 5
    steps:
      - name: Determine pipeline status
        id: status
        run: |
          if echo '${{ toJSON(needs) }}' | grep -q '"result":"failure"'; then
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "emoji=❌" >> "$GITHUB_OUTPUT"
          else
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "emoji=✅" >> "$GITHUB_OUTPUT"
          fi

      - name: Send Telegram notification
        env:
          STATUS_EMOJI: ${{ steps.status.outputs.emoji }}
          STATUS_TEXT: ${{ steps.status.outputs.status }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MESSAGE="${STATUS_EMOJI} *Bantis range* — ${STATUS_TEXT}
          Branch: \`${REF_NAME}\`
          Commit: \`${COMMIT_SHA}\`
          By: ${ACTOR}
          Run: ${RUN_URL}"

          curl -sS -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d parse_mode="Markdown" \
            --data-urlencode "text=$MESSAGE"